[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easel"
dynamic = ["version"]

[tool.setuptools_scm]
version_file = "easel/_version.py"

description = "Selection screens with HyPhy over thousands of coding sequences"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["phylogenetics", "selection", "hyphy", "snakemake", "toga"]
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
]


# ruamel.yaml and ete4 are the only imports of the CLI itself. snakemake and
# the SLURM plugin are runtime requirements of the workflow, not of the module,
# but easel is useless without them.
dependencies = [
  "ruamel.yaml>=0.17",
  "ete4>=4.0",
  "snakemake>=8.0",
  "snakemake-executor-plugin-slurm>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
# The DESCRIPTION told users to run `easel ...`; until now no such executable
# existed anywhere in the project.
easel = "easel.cli:main"

[project.urls]
Homepage = "https://github.com/ORG/easel"
Issues = "https://github.com/ORG/easel/issues"

[tool.setuptools]
# Workflow files live outside the package directory and must be installed with
# it, because cli.base_dir resolves to the parent of easel/.
packages = ["easel"]

[tool.setuptools.dynamic]
version = { attr = "easel.__version__" }

[tool.setuptools.data-files]
"share/easel" = ["Snakefile_standard", "Snakefile_speciesTree"]
"share/easel/rules" = ["rules/*.smk"]
"share/easel/envs" = ["envs/*.yaml"]
"share/easel/scripts" = ["scripts/*.py", "scripts/*.R"]
"share/easel/prof" = ["prof/config.yaml"]

[tool.ruff]
# Only the files easel ships; run directories a user creates are not ours to lint.
include = ["easel/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint.per-file-ignores]
# Snakemake injects a `snakemake` object into the module globals of any file
# used with a `script:` directive, so ruff cannot see where the name comes from
# and reports F821. Scoped to exactly the scripts invoked that way.
#
# NOT solved by declaring the name at module scope: check_alignment.py branches
# on `"snakemake" in globals()` to tell a snakemake run from a CLI debug run,
# and a module-level assignment would make that test always true.
"scripts/check_alignment.py" = ["F821"]
"scripts/filter_muscle_conf.py" = ["F821"]
"scripts/manual_filter_msa.py" = ["F821"]
"scripts/newick_tree_manipulator.py" = ["F821"]
"scripts/transform_aa.py" = ["F821"]

